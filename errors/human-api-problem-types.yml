format: proprietary-json
note: >-
  Human API does not use RFC 9457 problem+json. Errors are returned as a JSON object with
  the shape below (from the shared `error` schema declared in every Admin API spec). The
  x-humanapi-request-id field echoes the request id for support correlation. Validation
  failures use a SECOND, different envelope (`errorInvalidInput`) that renames `code` to
  `statusCode` and adds a `validation` block - two error shapes on the same API is a real
  agent-facing hazard and is recorded here rather than smoothed over. There is no published
  error-code registry; every code below is enumerated from the specs themselves.
envelope:
  media_type: application/json
  shape: '{ code, error, message, x-humanapi-request-id }'
  fields:
  - name: code
    description: Numeric HTTP status repeated in the body.
  - name: error
    description: Short error label (reason phrase).
  - name: message
    description: Human-readable error detail.
  - name: x-humanapi-request-id
    description: Request identifier (UUID) for support/tracing correlation.
alternate_envelope:
  name: errorInvalidInput
  media_type: application/json
  shape: '{ statusCode, error, message, validation: { source, keys[] }, x-humanapi-request-id }'
  used_by: [createUser, performActionForUser, userProviders]
  note: >-
    Semantic/validation errors return statusCode instead of code and add a validation object
    naming the offending payload keys. A client parsing only `code` will read undefined here.
