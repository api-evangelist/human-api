note: >-
  Human API's client libraries date from the consumer Data API era and live in the
  github.com/humanapi organization. Registry-published packages were verified against that
  org (first-party) or noted as community. The humanapi-mcp npm package is a DIFFERENT
  company (humanapi.ru) and is deliberately excluded. CURRENCY IS THE HEADLINE HERE: every
  registry-published first-party library except the Human Connect widget last shipped in
  2013. The Python SDK (which also provides the CLI) was last released 2013-10-03 and the
  Passport strategy 2013-07-06 - more than a decade before the v3.0 Health Intelligence
  Platform Admin API these libraries do not cover. Only humanapi-connect-client is
  maintained (2.4.5, 2026-01-27), which matches the product's shift from a consumer data
  SDK story to an enterprise EHR-ordering API with an embeddable connect widget.
