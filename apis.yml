- aid: human-api:human-api-authentication-api
  name: Human API Authentication API
  description: >-
    The HAPI Auth Public API for facilitating token exchange with external authentication
    systems. Exposes POST /v1/admin/token (Admin API client-type token via
    client_id/client_secret) and POST /v1/connect/token (public Connect token via
    client_id/client_user_id with optional client_secret, client_user_email, and
    extra_scopes). Served from https://auth.humanapi.co.
  humanURL: https://reference.humanapi.co/docs/overview
  baseURL: https://auth.humanapi.co
  tags:
  - Authentication
  - OAuth2
  - Tokens
  properties:
  - type: Documentation
    url: https://reference.humanapi.co/docs/overview
  - type: OpenAPI
    url: openapi/human-api-auth-admin-token-openapi.json
  - type: OpenAPI
    url: openapi/human-api-auth-connect-token-openapi.json
- aid: human-api:human-api-data-api
  name: Human API Data API
  description: >-
    The consumer-mediated Data API (legacy v2.1) for querying a user's normalized health
    data - wellness data from wearable devices and apps, and medical data (records, labs,
    medications, encounters) from health providers. Queries use the user's accessToken as a
    Bearer credential in a GET request against the base URL https://api.humanapi.co/v1/human.
  humanURL: https://reference.humanapi.co/v2.1/docs/data-overview
  baseURL: https://api.humanapi.co/v1/human
  tags:
  - Healthcare
