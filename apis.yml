aid: human-api
url: https://raw.githubusercontent.com/api-evangelist/human-api/refs/heads/main/apis.yml
name: Human API
kind: company
description: >-
  Human API is a United States health data platform, founded in 2013 and now part of
  LexisNexis Risk Solutions, that aggregates, normalizes, and delivers digital and clinical
  health data from providers, hospitals, labs, pharmacies, wearables, and apps through a
  single API. Its consumer-mediated Data API returns normalized wellness and medical
  records via user access tokens (Human Connect single sign-on), while its Health
  Intelligence Platform (HIP) Admin API lets enterprises order electronic health record
  (EHR) retrievals, manage users and subscriptions, and receive condensed clinical summary
  reports - primarily to accelerate life insurance underwriting by reaching 30,000+ data
  sources across roughly 270 million lives. The surface is a proprietary REST/JSON API
  secured with OAuth2-style client credentials and Bearer JWT tokens; it is not a HL7 FHIR
  or SMART-on-FHIR API. Access is gated behind a developer portal and partner agreement.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Healthcare
- United States
- Health Data
- EHR
- Interoperability
- Remote Monitoring
- Wearables
- Life Insurance
- Clinical Data
- Health API
