- aid: human-api:human-api-data-api
  name: Human API Data API
  description: >-
    The consumer-mediated Data API (legacy v2.1) for querying a user's normalized health data - wellness
    data from wearable devices and apps, and medical data (records, labs, medications, encounters) from
    health providers. Queries use the user's accessToken as a Bearer credential in a GET request against
    the base URL https://api.humanapi.co/v1/human.
