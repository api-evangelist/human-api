apis:
- aid: human-api:human-api-admin-api
  name: Human API Admin API
  description: >-
    The Health Intelligence Platform (HIP) Admin API for creating and managing Human API
    users, submitting and managing EHR order types, managing subscriptions, and fetching
    delivered clinical summary reports and order resources. Secured with a Bearer JWT
    (bearerAuth). Documented endpoints include /api/v1/order-types, /api/v1/users,
    /api/v1/users/actions, /api/v1/users/{humanId}, /api/v1/users/providers,
    /api/v1/subscriptions, /api/v1/user/reports, and /api/v1/resources/consumer-link.
  humanURL: https://reference.humanapi.co/docs/overview
  baseURL: https://admin.humanapi.co
  tags:
  - Healthcare
  - EHR
  - Health Data
  - Orders
