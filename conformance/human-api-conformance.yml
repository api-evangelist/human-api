note: >-
  Human API is a proprietary normalized-health-data REST API. It is explicitly NOT a HL7 FHIR
  / SMART-on-FHIR implementation - its own Epic Community Member documentation says the
  Medical API is "modeled after the data types available via FHIR" and that a FHIR-conformant
  export "adapter system" is still future work. The provider DOES publish a substantive
  compliance posture on that same page: HIPAA compliance across all data systems, AES-256
  encryption at rest with rotated keys in a separated key-management cluster, enforced HTTPS
  in transit, full activity logging, and a point-by-point statement of how the platform
  retains equivalent functionality to nine ONC 45 CFR 170.315 certification criteria while
  stating plainly that it is NOT formally ONC-certified. That published page is what the
  `Compliance` pointer in apis.yml resolves to. No SOC 2, ISO 27001 or HITRUST attestation,
  and no trust center, was found on any public Human API or LexisNexis Risk host.
